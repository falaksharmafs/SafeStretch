name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgrouting/pgrouting:16-3.4-3.6
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: roadrisk}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/roadrisk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: python -m src.migrate
      - run: pytest -q
